name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 下载 XcodeGen（不走 brew）
        run: |
          set -e
          curl -L -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip
          unzip -q xcodegen.zip -d xcodegen_dl
          echo "XG_BIN=$(pwd)/xcodegen_dl/xcodegen/bin/xcodegen" >> $GITHUB_ENV

      - name: 生成 Xcode 工程
        run: "$XG_BIN generate"

      - name: 编译（build，产出真正的 .app）
        run: |
          set -e
          xcodebuild \
            -project YuyuanBridge.xcodeproj \
            -scheme YuyuanBridge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 打包成未签名 .ipa（带占位 ad-hoc 签名）
        run: |
          set -e
          APP_PATH=$(find DerivedData -name "YuyuanBridge.app" -type d | head -n 1)
          echo "找到 App：$APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "❌ 没找到 .app"; exit 1; fi
          # 关键：塞一个占位 ad-hoc 签名(-)，让全能签能识别成主包(它之后会用你的证书重签)
          codesign --force --sign - --timestamp=none "$APP_PATH" || true
          echo "=== 确认签名信息 ==="
          ls -la "$APP_PATH" | grep -i codesign || echo "(没有 _CodeSignature 目录，继续看下面)"
          codesign -dv "$APP_PATH" 2>&1 || true
          rm -rf staging out
          mkdir -p staging/Payload
          cp -R "$APP_PATH" staging/Payload/
          mkdir -p out
          cd staging
          python3 -c "import shutil; shutil.make_archive('../out/YuyuanBridge-unsigned', 'zip', '.')"
          cd ..
          mv out/YuyuanBridge-unsigned.zip out/YuyuanBridge-unsigned.ipa
          echo "=== ipa 内部结构 ==="
          unzip -l out/YuyuanBridge-unsigned.ipa
          ls -lh out

      - name: 上传 .ipa
        uses: actions/upload-artifact@v4
        with:
          name: YuyuanBridge-unsigned-ipa
          path: out/YuyuanBridge-unsigned.ipa
