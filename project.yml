# XcodeGen 配置：CI 上用它把这份 yaml 生成 .xcodeproj，再编译。
# 你（非程序员）基本不用改这个文件，除非要改 App 名字/scheme/包名。
name: YuyuanBridge
options:
  bundleIdPrefix: com.yuyuan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  YuyuanBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuyuan.bridge   # 包名，社区分发可改成你自己的
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"                  # 1=iPhone 2=iPad，都支持
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  YuyuanBridge:
    build:
      targets:
        YuyuanBridge: all
    run:
      config: Release
    archive:
      config: Release
