name: YuyuanBridge
options:
  bundleIdPrefix: com.yuyuan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  YuyuanBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources
        includes:
          - "*.swift"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuyuan.bridge
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: Sources/Entitlements.plist   # HealthKit 权限(全能签重签时需保留)

schemes:
  YuyuanBridge:
    build:
      targets:
        YuyuanBridge: all
    run:
      config: Release
    archive:
      config: Release
